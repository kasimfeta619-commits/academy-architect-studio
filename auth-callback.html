<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Потвърждение на администраторски профил | Academy Architect Studio</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-client.js"></script>
    <style>
        body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg-color, #fbf9f4); color: var(--text-color, #1a1a1a); }
        main { width: min(100%, 520px); padding: 32px; border: 1px solid #eadecc; border-radius: 12px; background: #fff; text-align: center; }
        h1 { margin: 0 0 12px; font-size: 1.45rem; font-weight: 500; }
        p { color: #8c8275; line-height: 1.6; }
        a { color: inherit; }
    </style>
</head>
<body>
    <main>
        <h1>Потвърждение на профила</h1>
        <p id="authStatus" role="status" aria-live="polite">Проверяваме защитената връзка...</p>
    </main>
    <script>
        (async function () {
            const status = document.getElementById('authStatus');
            const params = new URLSearchParams(window.location.search);
            const hashParams = new URLSearchParams(window.location.hash.slice(1));
            try {
                let error = null;
                const code = params.get('code');
                const tokenHash = params.get('token_hash');
                const type = params.get('type');

                if (code) {
                    ({ error } = await window.siteSupabase.auth.exchangeCodeForSession(code));
                } else if (tokenHash && type) {
                    ({ error } = await window.siteSupabase.auth.verifyOtp({ token_hash: tokenHash, type }));
                } else if (hashParams.has('access_token') && hashParams.has('refresh_token')) {
                    ({ error } = await window.siteSupabase.auth.setSession({
                        access_token: hashParams.get('access_token'),
                        refresh_token: hashParams.get('refresh_token')
                    }));
                }

                if (error) throw error;
                const { data, error: sessionError } = await window.siteSupabase.auth.getSession();
                if (sessionError || data.session?.user?.email?.toLowerCase() !== window.SITE_ADMIN_EMAIL) {
                    throw new Error('profile confirmation unavailable');
                }

                status.textContent = 'Профилът е потвърден. Отваряме админ панела...';
                window.location.replace('/admin.html');
            } catch (error) {
                status.textContent = 'Не успяхме да потвърдим профила. Върни се към входа и опитай отново или заяви нов линк.';
                const link = document.createElement('a');
                link.href = '/login.html?admin=1';
                link.textContent = 'Към администраторския вход';
                status.append(' ', link);
            }
        })();
    </script>
</body>
</html>
