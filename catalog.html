<script src="translations.js"></script>
    <script src="auth.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDeezhyddNjZyOeo9MyuwOuhXvFCCscUzg",
            authDomain: "architect-studio-1810c.firebaseapp.com",
            projectId: "architect-studio-1810c",
            storageBucket: "architect-studio-1810c.firebasestorage.app",
            messagingSenderId: "1053914253758",
            appId: "1:1053914253758:web:97d9bc28ac5465730311ef",
            measurementId: "G-NN7GYSF55G"
        };

        let app;
        try {
            app = initializeApp(firebaseConfig);
        } catch (e) {}

        let allProjectsGlobal = [];
        let activeCategory = 'all';
        let activeSubFilter = 'all';

        window.toggleDarkMode = function() {
            const isDark = document.documentElement.classList.toggle('dark-mode');
            document.body.classList.toggle('dark-mode', isDark);
            localStorage.setItem('siteTheme', isDark ? 'dark' : 'light');
        };

        window.toggleMobileMenu = function() {
            document.getElementById('nav-links').classList.toggle('mobile-open');
        };

        window.setCategoryFilter = function(category, btnElement) {
            activeCategory = category;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            filterProjects();
        };

        window.setSubFilter = function(sub, btnElement) {
            activeSubFilter = sub;
            document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            filterProjects();
        };

        window.resetFilters = function() {
            document.getElementById('projectSearchInput').value = '';
            activeCategory = 'all';
            activeSubFilter = 'all';
            
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
            
            const firstCat = document.querySelector('.cat-btn');
            if(firstCat) firstCat.classList.add('active');
            const firstSub = document.querySelector('.sub-btn');
            if(firstSub) firstSub.classList.add('active');

            renderProjectsList(allProjectsGlobal);
        };

        window.filterProjects = function() {
            const searchText = document.getElementById('projectSearchInput').value.toLowerCase().trim();
            
            const filtered = allProjectsGlobal.filter(p => {
                const title = (p.title || '').toLowerCase();
                const idStr = String(p.id || '').toLowerCase();
                const catStr = (p.category || '').toLowerCase();
                const materialStr = (p.material || '').toLowerCase();
                const styleStr = (p.style || '').toLowerCase();
                
                const matchesSearch = !searchText || title.includes(searchText) || idStr.includes(searchText) || styleStr.includes(searchText) || catStr.includes(searchText);

                let matchesCat = true;
                if (activeCategory !== 'all') {
                    if (activeCategory === 'houses') {
                        matchesCat = catStr.includes('жилищна') || catStr.includes('house');
                    } else if (activeCategory === 'interior') {
                        matchesCat = catStr.includes('интериор') || catStr.includes('interior');
                    } else if (activeCategory === 'public') {
                        matchesCat = catStr.includes('обществени') || catStr.includes('industrial') || catStr.includes('public');
                    } else if (activeCategory === 'reconstruction') {
                        matchesCat = catStr.includes('реконструкц') || catStr.includes('reconstruction');
                    } else if (activeCategory === 'engineering') {
                        matchesCat = catStr.includes('заснемане') || catStr.includes('engineering');
                    } else {
                        matchesCat = catStr.includes(activeCategory);
                    }
                }

                let matchesSub = true;
                if (activeSubFilter !== 'all') {
                    let subKey = activeSubFilter;
                    if (subKey === 'wood') subKey = 'дърв';
                    else if (subKey === 'stone') subKey = 'кам';
                    else if (subKey === 'concrete') subKey = 'бетон';
                    else if (subKey === 'prefabricated') subKey = 'сглобяем';
                    else if (subKey === 'modern') subKey = 'modern';
                    else if (subKey === 'bulgarian') subKey = 'български';

                    matchesSub = materialStr.includes(subKey) || styleStr.includes(subKey) || title.includes(subKey);
                }

                return matchesSearch && matchesCat && matchesSub;
            });

            renderProjectsList(filtered);
        };

        function renderProjectsList(projectsList) {
            const container = document.getElementById('catalogProjectsContainer');
            const currentLang = localStorage.getItem('siteLang') || 'bg';
            const areaUnit = currentLang === 'en' ? 'sq.m' : 'кв.м';

            if (!container) return;

            if (projectsList.length > 0) {
                container.innerHTML = projectsList.map((p, index) => {
                    const projectId = p.id || index;
                    const displayCode = p.code || `#${String(index + 1).padStart(3, '0')}`;
                    const imgSrc = p.mainImage || (p.gallery && p.gallery[0]) || 'assets/main-graphic.png';

                    return `
                        <a href="project-detail.html?id=${projectId}" class="project-card">
                            <div class="project-img-box">
                                <span class="project-code-badge">${displayCode}</span>
                                <img src="${imgSrc}" alt="${p.title}" onerror="this.src='https://placehold.co/600x400?text=Image'">
                            </div>
                            <div class="project-info">
                                <span class="p-title">${p.title}</span>
                                <div class="p-meta-row">
                                    <span>${p.style || p.category || (currentLang === 'en' ? 'Architectural Project' : 'Архитектурен проект')}</span>
                                    <span style="font-weight: 500; color: var(--text-color, #111);">${p.area ? p.area + ' ' + areaUnit : '-'}</span>
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');
            } else {
                const noMsg = currentLang === 'en' ? 'No matching projects found.' : 'Няма намерени обекти, отговарящи на зададените критерии.';
                container.innerHTML = `<p style="color: #888; font-size: 0.95rem; grid-column: 1 / -1; padding: 20px 0;">${noMsg}</p>`;
            }
        }

        document.addEventListener("DOMContentLoaded", async function() {
            const savedTheme = localStorage.getItem('siteTheme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark-mode');
                document.body.classList.add('dark-mode');
            }

            if (typeof initLanguage === 'function') {
                initLanguage();
            } else if (typeof setLanguage === 'function') {
                setLanguage(localStorage.getItem('siteLang') || 'bg');
            }

            const container = document.getElementById('catalogProjectsContainer');

            if (container) {
                try {
                    const dbInstance = window.db || getFirestore(app);
                    let projects = [];
                    if (dbInstance) {
                        const querySnapshot = await getDocs(collection(dbInstance, "projects"));
                        querySnapshot.forEach((docSnap) => {
                            projects.push({ id: docSnap.id, ...docSnap.data() });
                        });
                    } else {
                        projects = JSON.parse(localStorage.getItem('myProjects') || '[]');
                    }

                    allProjectsGlobal = projects.slice().reverse();
                    renderProjectsList(allProjectsGlobal);

                } catch (error) {
                    console.error("Грешка при зареждане:", error);
                    const currentLang = localStorage.getItem('siteLang') || 'bg';
                    const errText = currentLang === 'en' ? 'Error loading catalog.' : 'Грешка при зареждане на каталога.';
                    container.innerHTML = `<p style="color: #ff6b6b; font-size: 0.95rem; grid-column: 1 / -1;">${errText}</p>`;
                }
            }

            try {
                const dbInstance = window.db || getFirestore(app);
                const contactSnap = await getDoc(doc(dbInstance, "siteSettings", "contact"));
                if (contactSnap.exists()) {
                    const data = contactSnap.data();
                    if (data.address && document.getElementById('footAddress')) document.getElementById('footAddress').textContent = data.address;
                    if (data.email) {
                        if (document.getElementById('footEmail')) document.getElementById('footEmail').textContent = data.email;
                        if (document.getElementById('footEmailLink')) document.getElementById('footEmailLink').href = 'mailto:' + data.email;
                    }
                    if (data.phone && document.getElementById('footPhone')) document.getElementById('footPhone').textContent = data.phone;
                }
            } catch (e) {}

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    setTimeout(() => {
                        renderProjectsList(allProjectsGlobal);
                    }, 50);
                });
            });
        });
    </script>
