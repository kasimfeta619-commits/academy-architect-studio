<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детайли за проекта | Academy Architect Studio</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- Свързваме файла с преводи -->
    <script src="translations_2.js"></script>

    <style>
        body { background-color: var(--bg-color, #fbf9f4); color: var(--text-color, #1a1a1a); font-family: sans-serif; margin: 0; transition: background-color 0.3s, color 0.3s; }
        .project-detail-container { padding: 40px 8%; max-width: 1100px; margin: 0 auto; min-height: 80vh; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #8c8275; text-decoration: none; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .back-link:hover { color: var(--text-color, #1a1a1a); }
        
        .project-header-info { margin-bottom: 30px; }
        .project-title { font-size: 2.5rem; font-weight: 400; margin-bottom: 10px; color: #1a1a1a; }
        .project-meta-tags { display: flex; gap: 15px; flex-wrap: wrap; font-size: 0.85rem; color: #8c8275; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; margin-bottom: 20px; }
        
        .main-project-img { width: 100%; max-height: 550px; object-fit: cover; border-radius: 4px; border: 1px solid #eadecc; margin-bottom: 30px; }
        
        .project-grid-specs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; background: #f4eee5; padding: 25px; border: 1px solid #eadecc; margin-bottom: 40px; }
        .spec-item label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #8c8275; font-weight: 700; margin-bottom: 5px; }
        .spec-item span { font-size: 1.1rem; font-weight: 600; color: #1a1a1a; }

        .project-desc-section { font-size: 1.05rem; line-height: 1.8; color: #444; margin-bottom: 40px; white-space: pre-line; }

        .gallery-section-title { font-size: 1.3rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; font-weight: 600; border-bottom: 1px solid #eadecc; padding-bottom: 10px; }
        .project-images-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .project-images-grid img { width: 100%; height: 220px; object-fit: cover; border-radius: 4px; border: 1px solid #eadecc; cursor: pointer; transition: transform 0.2s; }
        .project-images-grid img:hover { transform: scale(1.02); }

        /* Тъмна тема */
        body.dark-mode { background-color: #121212 !important; color: #ffffff !important; }
        body.dark-mode header.navbar { background: #1a1a1a !important; border-bottom-color: #2c2c2c !important; }
        body.dark-mode .project-title, body.dark-mode .spec-item span { color: #ffffff !important; }
        body.dark-mode .project-grid-specs { background: #1e1e1e !important; border-color: #2c2c2c !important; }
        body.dark-mode .project-desc-section { color: #cccccc !important; }
        body.dark-mode .main-project-img, body.dark-mode .project-images-grid img { border-color: #333 !important; }
    </style>
</head>
<body>

    <!-- Навигация с бутони за езици и тъмен режим -->
    <header class="navbar" style="padding: 15px 5%; border-bottom: 1px solid #eadecc; display: flex; align-items: center; justify-content: space-between; background: #fbf9f4;">
        <a href="index.html" class="logo-area" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
            <svg style="height: 30px; width: 30px; fill: #8c8275;" viewBox="0 0 24 24">
                <path d="M12 3L2 12h3v8h14v-8h3L12 3zm0 2.84L17 10.5V18H7v-7.5l5-4.66z"/>
            </svg>
            <span style="font-weight: 500; color: var(--text-color, #1a1a1a); font-size: 1rem;">Academy Architect <span style="font-weight: 700; color: #8c8275;">Studio</span></span>
        </a>

        <div style="display: flex; align-items: center; gap: 15px;">
            <!-- Езикови бутони -->
            <button id="btn-bg" onclick="setLanguage('bg')" style="background: none; border: 1px solid #eadecc; padding: 6px 10px; cursor: pointer; font-weight: 600;">BG</button>
            <button id="btn-en" onclick="setLanguage('en')" style="background: none; border: 1px solid #eadecc; padding: 6px 10px; cursor: pointer; font-weight: 600;">EN</button>
            <button id="darkModeBtn" onclick="toggleDarkMode()" style="background: none; border: 1px solid #eadecc; padding: 8px 12px; cursor: pointer; border-radius: 4px; color: inherit;">🌙</button>
        </div>
    </header>

    <main class="project-detail-container">
        <a href="index.html" class="back-link" data-key="back-to-home">← Назад към проектите</a>
        
        <div id="projectDetailsArea">
            <p style="text-align: center; color: #8c8275; padding: 50px;" data-key="loading-project">Зареждане на детайлите за проекта...</p>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDeezhyddNjZyOeo9MyuwOuhXvFCCscUzg",
            authDomain: "architect-studio-1810c.firebaseapp.com",
            projectId: "architect-studio-1810c",
            storageBucket: "architect-studio-1810c.firebasestorage.app",
            messagingSenderId: "1053914253758",
            appId: "1:1053914253758:web:97d9bc28ac5465730311ef",
            measurementId: "G-NN7GYSF55G"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Речници за превод на динамичните полета от админ панела
        const categoryMap = {
            'residential': { bg: 'Жилищна и многофамилна сграда', en: 'Residential & Multi-family Building' },
            'commercial': { bg: 'Търговски обект и промишлена сграда', en: 'Commercial & Industrial Building' },
            'interior': { bg: 'Интериорен дизайн и обзавеждане', en: 'Interior Design & Furnishing' }
        };

        const subCategoryMap = {
            'architecture': { bg: 'Архитектурен проект', en: 'Architectural Project' },
            '3d': { bg: '3D сграда / Визуализация', en: '3D Building / Visualization' }
        };

        const styleMap = {
            'Classic': { bg: 'Класически', en: 'Classic' },
            'Minimalist': { bg: 'Минималистичен', en: 'Minimalist' },
            'Modern': { bg: 'Модерен', en: 'Modern' },
            'Scandinavian': { bg: 'Скандинавски', en: 'Scandinavian' },
            'Industrial': { bg: 'Индустриален', en: 'Industrial' },
            'Bulgarian': { bg: 'Български', en: 'Bulgarian' },
            'Mediterranean': { bg: 'Средиземноморски', en: 'Mediterranean' }
        };

        // Функция за взимане на ID на проекта от URL (напр. project-detail.html?id=XYZ)
        function getProjectIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        async function loadProjectDetails() {
            const projectId = getProjectIdFromUrl();
            const container = document.getElementById('projectDetailsArea');

            if (!projectId) {
                container.innerHTML = `<p style="color: red;">Не е намерен такъв проект в заявката.</p>`;
                return;
            }

            try {
                const docSnap = await db.collection('projects').doc(projectId).get();
                if (!docSnap.exists) {
                    container.innerHTML = `<p style="color: red;">Проектът не съществува в базата данни.</p>`;
                    return;
                }

                const p = docSnap.data();
                window.currentProjectData = p; // Запазваме данните глобално, за да ги превеждаме при смяна на езика

                renderProjectContent(p);
            } catch (err) {
                console.error(err);
                container.innerHTML = `<p style="color: red;">Грешка при зареждане на данните: ${err.message}</p>`;
            }
        }

        function renderProjectContent(p) {
            const container = document.getElementById('projectDetailsArea');
            const currentLang = localStorage.getItem('siteLang') || 'bg';

            // Превеждаме категориите и стиловете според текущия език
            const mainCatText = categoryMap[p.mainCategory]?.[currentLang] || p.mainCategory || '-';
            const subCatText = subCategoryMap[p.subCategory]?.[currentLang] || p.subCategory || '-';
            const styleText = styleMap[p.style]?.[currentLang] || p.style || '-';

            // Видео секция
            let videoHtml = '';
            if (p.youtubeUrl) {
                let embedUrl = p.youtubeUrl;
                let match = p.youtubeUrl.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
                if (match && match[2].length === 11) embedUrl = `https://www.youtube.com/embed/${match[2]}`;
                
                videoHtml = `
                    <div style="margin-bottom: 40px;">
                        <h3 class="gallery-section-title">${currentLang === 'en' ? 'Video Presentation' : 'Видео презентация'}</h3>
                        <div style="position: relative; width: 100%; padding-bottom: 56.25%; height: 0;">
                            <iframe src="${embedUrl}" style="position: absolute; top:0; left:0; width:100%; height:100%; border:0; border-radius: 4px;" allowfullscreen></iframe>
                        </div>
                    </div>
                `;
            }

            // Галерии и изображения
            let floorPlansHtml = p.floorPlans && p.floorPlans.length ? `<h3 class="gallery-section-title">${currentLang === 'en' ? 'Floor Plans' : 'Разпределения'}</h3><div class="project-images-grid">${p.floorPlans.map(img => `<img src="${img}" onclick="window.open(this.src)">`).join('')}</div>` : '';
            let facadeHtml = p.facadeImages && p.facadeImages.length ? `<h3 class="gallery-section-title">${currentLang === 'en' ? 'Facades' : 'Фасади'}</h3><div class="project-images-grid">${p.facadeImages.map(img => `<img src="${img}" onclick="window.open(this.src)">`).join('')}</div>` : '';
            let galleryHtml = p.gallery && p.gallery.length ? `<h3 class="gallery-section-title">${currentLang === 'en' ? 'Gallery' : 'Галерия'}</h3><div class="project-images-grid">${p.gallery.map(img => `<img src="${img}" onclick="window.open(this.src)">`).join('')}</div>` : '';

            container.innerHTML = `
                <div class="project-header-info">
                    <h1 class="project-title">${p.title}</h1>
                    <div class="project-meta-tags">
                        <span>📁 ${mainCatText}</span> | 
                        <span>📐 ${subCatText}</span>
                    </div>
                </div>

                ${p.mainImage ? `<img src="${p.mainImage}" alt="${p.title}" class="main-project-img">` : ''}

                <div class="project-grid-specs">
                    <div class="spec-item"><label>${currentLang === 'en' ? 'Area' : 'Площ'}</label><span>${p.area ? p.area + ' м²' : '-'}</span></div>
                    <div class="spec-item"><label>${currentLang === 'en' ? 'Floors' : 'Етажи'}</label><span>${p.floors || '-'}</span></div>
                    <div class="spec-item"><label>${currentLang === 'en' ? 'Bedrooms' : 'Спални'}</label><span>${p.beds || '-'}</span></div>
                    <div class="spec-item"><label>${currentLang === 'en' ? 'Bathrooms' : 'Бани'}</label><span>${p.baths || '-'}</span></div>
                    <div class="spec-item"><label>${currentLang === 'en' ? 'Style' : 'Стил'}</label><span>${styleText}</span></div>
                    <div class="spec-item"><label>${currentLang === 'en' ? 'Material' : 'Конструкция'}</label><span>${p.material || '-'}</span></div>
                    <div class="spec-item"><label>${currentLang === 'en' ? 'Price' : 'Цена'}</label><span>${p.price ? p.price + ' €' : '-'}</span></div>
                </div>

                <div class="project-desc-section">
                    <h3 class="gallery-section-title" style="margin-bottom: 15px;">${currentLang === 'en' ? 'Description' : 'Описание на проекта'}</h3>
                    <p>${p.desc || (currentLang === 'en' ? 'No description provided.' : 'Няма въведено описание.')}</p>
                </div>

                ${videoHtml}
                ${floorPlansHtml}
                ${facadeHtml}
                ${p.sectionImage ? `<h3 class="gallery-section-title">${currentLang === 'en' ? 'Section' : 'Разрез'}</h3><div class="project-images-grid"><img src="${p.sectionImage}" onclick="window.open(this.src)"></div>` : ''}
                ${galleryHtml}
            `;
        }

        // Пренаписваме функцията setLanguage така, че да обновява както статичните ключове (от translations_2.js), така и динамичните данни на проекта
        const originalSetLanguage = window.setLanguage;
        window.setLanguage = function(lang) {
            localStorage.setItem('siteLang', lang);
            if (typeof originalSetLanguage === 'function') {
                originalSetLanguage(lang);
            }
            // Ако вече имаме заредени данни за проекта, ги прерисуваме на новия език
            if (window.currentProjectData) {
                renderProjectContent(window.currentProjectData);
            }
        };

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('siteTheme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }

        // Инициализация при зареждане
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('siteTheme');
            if (savedTheme === 'dark') document.body.classList.add('dark-mode');

            const savedLang = localStorage.getItem('siteLang') || 'bg';
            if (typeof setLanguage === 'function') {
                setLanguage(savedLang);
            }

            loadProjectDetails();
        });
    </script>
</body>
</html>
