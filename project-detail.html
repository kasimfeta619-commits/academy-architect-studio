<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детайли за проекта | Academy Architect Studio</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- Свързваме файла с преводи -->
    <script src="translations_2.js"></script>

    <style>
        body { background-color: var(--bg-color, #fbf9f4); color: var(--text-color, #1a1a1a); font-family: sans-serif; margin: 0; transition: background-color 0.3s, color 0.3s; }
        .project-detail-container { padding: 30px 5%; max-width: 1400px; margin: 0 auto; min-height: 80vh; }
        
        .top-bar-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .project-selector-wrapper { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #8c8275; font-weight: 700; }
        .project-selector-wrapper select { padding: 8px 12px; border: 1px solid #eadecc; background: #fff; font-size: 0.9rem; font-family: inherit; cursor: pointer; outline: none; }

        .project-main-layout { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 30px; margin-bottom: 40px; }
        @media (max-width: 992px) { .project-main-layout { grid-template-columns: 1fr; } }

        .main-project-img { width: 100%; height: 450px; object-fit: cover; border: 1px solid #eadecc; border-radius: 4px; background: #f4eee5; }
        
        .sidebar-card { background: #f4eee5; padding: 25px; border: 1px solid #eadecc; margin-bottom: 20px; }
        .sidebar-card h4 { margin-top: 0; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #8c8275; margin-bottom: 15px; font-weight: 700; }
        
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eadecc; font-size: 0.9rem; }
        .info-row:last-child { border-bottom: none; }
        .info-row span:first-child { color: #8c8275; text-transform: uppercase; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; }
        .info-row span:last-child { font-weight: 600; color: #1a1a1a; text-align: right; }

        .section-category-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #8c8275; font-weight: 700; margin-bottom: 5px; }
        .section-heading { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; font-weight: 600; border-bottom: 1px solid #eadecc; padding-bottom: 10px; }
        
        .project-images-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .project-images-grid img { width: 100%; height: 220px; object-fit: cover; border-radius: 4px; border: 1px solid #eadecc; cursor: pointer; transition: transform 0.2s; }
        .project-images-grid img:hover { transform: scale(1.02); }

        /* Тъмна тема */
        body.dark-mode { background-color: #121212 !important; color: #ffffff !important; }
        body.dark-mode header.navbar { background: #1a1a1a !important; border-bottom-color: #2c2c2c !important; }
        body.dark-mode .sidebar-card, body.dark-mode .project-selector-wrapper select { background: #1e1e1e !important; border-color: #333 !important; color: #fff !important; }
        body.dark-mode .info-row { border-bottom-color: #333 !important; }
        body.dark-mode .info-row span:last-child { color: #fff !important; }
        body.dark-mode .main-project-img, body.dark-mode .project-images-grid img { border-color: #333 !important; }
    </style>
</head>
<body>

    <!-- Навигация -->
    <header class="navbar" style="padding: 15px 5%; border-bottom: 1px solid #eadecc; display: flex; align-items: center; justify-content: space-between; background: #fbf9f4;">
        <a href="index.html" class="logo-area" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
            <svg style="height: 30px; width: 30px; fill: #8c8275;" viewBox="0 0 24 24">
                <path d="M12 3L2 12h3v8h14v-8h3L12 3zm0 2.84L17 10.5V18H7v-7.5l5-4.66z"/>
            </svg>
            <span style="font-weight: 500; color: var(--text-color, #1a1a1a); font-size: 1rem;">Academy Architect <span style="font-weight: 700; color: #8c8275;">Studio</span></span>
        </a>

        <div style="display: flex; align-items: center; gap: 15px;">
            <button id="btn-bg" onclick="setLanguage('bg')" style="background: none; border: 1px solid #eadecc; padding: 6px 10px; cursor: pointer; font-weight: 600;">BG</button>
            <button id="btn-en" onclick="setLanguage('en')" style="background: none; border: 1px solid #eadecc; padding: 6px 10px; cursor: pointer; font-weight: 600;">EN</button>
            <button id="darkModeBtn" onclick="toggleDarkMode()" style="background: none; border: 1px solid #eadecc; padding: 8px 12px; cursor: pointer; border-radius: 4px; color: inherit;">🌙</button>
        </div>
    </header>

    <main class="project-detail-container" id="projectContainer">
        <!-- Тук всичко се зарежда динамично от скриптка по-долу -->
        <p style="text-align: center; color: #8c8275; padding: 50px;" data-key="loading-project">Зареждане на детайлите за проекта...</p>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDeezhyddNjZyOeo9MyuwOuhXvFCCscUzg",
            authDomain: "architect-studio-1810c.firebaseapp.com",
            projectId: "architect-studio-1810c",
            storageBucket: "architect-studio-1810c.firebasestorage.app",
            messagingSenderId: "1053914253758",
            appId: "1:1053914253758:web:97d9bc28ac5465730311ef",
            measurementId: "G-NN7GYSF55G"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Речници за превод на динамичните полета
        const categoryMap = {
            'residential': { bg: 'Жилищна и многофамилна сграда', en: 'Residential & Multi-family Building' },
            'commercial': { bg: 'Търговски обект и промишлена сграда', en: 'Commercial & Industrial Building' },
            'interior': { bg: 'Интериорен дизайн и обзавеждане', en: 'Interior Design & Furnishing' }
        };

        const subCategoryMap = {
            'architecture': { bg: 'Архитектурен проект', en: 'Architectural Project' },
            '3d': { bg: '3D сграда / Визуализация', en: '3D Building / Visualization' }
        };

        const styleMap = {
            'Classic': { bg: 'Класически', en: 'Classic' },
            'Minimalist': { bg: 'Минималистичен', en: 'Minimalist' },
            'Modern': { bg: 'Модерен', en: 'Modern' },
            'Scandinavian': { bg: 'Скандинавски', en: 'Scandinavian' },
            'Industrial': { bg: 'Индустриален', en: 'Industrial' },
            'Bulgarian': { bg: 'Български', en: 'Bulgarian' },
            'Mediterranean': { bg: 'Средиземноморски', en: 'Mediterranean' }
        };

        function getProjectIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        let allProjectsList = [];
        let currentProjectId = null;

        async function initProjectPage() {
            currentProjectId = getProjectIdFromUrl();
            
            try {
                const snapshot = await db.collection('projects').get();
                allProjectsList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                if (allProjectsList.length === 0) {
                    document.getElementById('projectContainer').innerHTML = `<p style="text-align:center;">Няма налични проекти.</p>`;
                    return;
                }

                // Ако няма подадено ID в линка, взимаме първия проект по подразбиране
                if (!currentProjectId) {
                    currentProjectId = allProjectsList[0].id;
                }

                renderFullPage();
            } catch (err) {
                console.error(err);
                document.getElementById('projectContainer').innerHTML = `<p style="color:red; text-align:center;">Грешка при зареждане: ${err.message}</p>`;
            }
        }

        function renderFullPage() {
            const currentLang = localStorage.getItem('siteLang') || 'bg';
            const project = allProjectsList.find(p => p.id === currentProjectId) || allProjectsList[0];
            window.activeProjectData = project; // пазим го за смяната на езика

            const mainCatText = categoryMap[project.mainCategory]?.[currentLang] || project.mainCategory || '-';
            const styleText = styleMap[project.style]?.[currentLang] || project.style || '-';

            // Падащо меню за избор на друг проект
            const selectorOptions = allProjectsList.map(p => `
                <option value="${p.id}" ${p.id === project.id ? 'selected' : ''}>${p.title}</option>
            `).join('');

            // Видео секция ако има
            let videoHtml = '';
            if (project.youtubeUrl) {
                let embedUrl = project.youtubeUrl;
                let match = project.youtubeUrl.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
                if (match && match[2].length === 11) embedUrl = `https://www.youtube.com/embed/${match[2]}`;
                
                videoHtml = `
                    <div style="margin-top: 40px;">
                        <h3 class="section-heading">${currentLang === 'en' ? 'Video Presentation' : 'Видео презентация'}</h3>
                        <div style="position: relative; width: 100%; padding-bottom: 56.25%; height: 0;">
                            <iframe src="${embedUrl}" style="position: absolute; top:0; left:0; width:100%; height:100%; border:0; border-radius: 4px;" allowfullscreen></iframe>
                        </div>
                    </div>
                `;
            }

            // Галерии
            let floorPlansHtml = project.floorPlans && project.floorPlans.length ? `
                <div style="margin-top: 40px;">
                    <div class="section-category-title">${currentLang === 'en' ? 'Technical Documentation' : 'Техническа документация'}</div>
                    <h3 class="section-heading">${currentLang === 'en' ? 'Floor Plans' : 'Разпределения по етажи'}</h3>
                    <div class="project-images-grid">${project.floorPlans.map(img => `<img src="${img}" onclick="window.open(this.src)">`).join('')}</div>
                </div>` : '';

            let facadeHtml = project.facadeImages && project.facadeImages.length ? `
                <div style="margin-top: 40px;">
                    <div class="section-category-title">${currentLang === 'en' ? 'Technical Documentation' : 'Техническа документация'}</div>
                    <h3 class="section-heading">${currentLang === 'en' ? 'Facades & Sections' : 'Фасади и Разрези'}</h3>
                    <div class="project-images-grid">${project.facadeImages.map(img => `<img src="${img}" onclick="window.open(this.src)">`).join('')}</div>
                </div>` : '';

            let galleryHtml = project.gallery && project.gallery.length ? `
                <div style="margin-top: 40px;">
                    <h3 class="section-heading">${currentLang === 'en' ? 'Gallery' : 'Галерия'}</h3>
                    <div class="project-images-grid">${project.gallery.map(img => `<img src="${img}" onclick="window.open(this.src)">`).join('')}</div>
                </div>` : '';

            const container = document.getElementById('projectContainer');
            container.innerHTML = `
                <!-- Горна лента с името и падащото меню за смяна на проект -->
                <div class="top-bar-flex">
                    <h2 style="margin: 0; font-size: 1.5rem; font-weight: 400;">${project.title}</h2>
                    <div class="project-selector-wrapper">
                        <span>${currentLang === 'en' ? 'Select Project:' : 'Избери проект:'}</span>
                        <select onchange="switchProject(this.value)">
                            ${selectorOptions}
                        </select>
                    </div>
                </div>

                <!-- Основна секция с голяма снимка и двете странични кутии -->
                <div class="project-main-layout">
                    <div>
                        ${project.mainImage ? `<img src="${project.mainImage}" alt="${project.title}" class="main-project-img">` : `<div class="main-project-img" style="display:flex; align-items:center; justify-content:center; color:#8c8275;">Няма основна снимка</div>`}
                    </div>
                    <div>
                        <!-- Информация за проекта -->
                        <div class="sidebar-card">
                            <h4>${currentLang === 'en' ? 'Project Information' : 'Информация за проекта'}</h4>
                            <div style="font-weight: 600; margin-bottom: 15px; font-size: 1.1rem; color: #1a1a1a;">${project.title}</div>
                            
                            <div class="info-row"><span>${currentLang === 'en' ? 'Category' : 'Категория'}</span><span>${mainCatText}</span></div>
                            <div class="info-row"><span>${currentLang === 'en' ? 'Style' : 'Стил'}</span><span>${styleText}</span></div>
                            <div class="info-row"><span>${currentLang === 'en' ? 'Construction' : 'Конструкция'}</span><span>${project.material || '-'}</span></div>
                            <div class="info-row"><span>${currentLang === 'en' ? 'Area' : 'Площ'}</span><span>${project.area ? project.area + ' sq.m' : '-'}</span></div>
                            <div class="info-row"><span>${currentLang === 'en' ? 'Floors' : 'Етажи'}</span><span>${project.floors || '-'}</span></div>
                            <div class="info-row"><span>${currentLang === 'en' ? 'Project Price' : 'Цена на проекта'}</span><span>${project.price ? project.price + ' €' : '-'}</span></div>
                        </div>

                        <!-- Мнение на общността -->
                        <div class="sidebar-card">
                            <h4>${currentLang === 'en' ? 'Community Feedback' : 'Мнение на общността'}</h4>
                            <div style="font-weight: 600; margin-bottom: 5px;">${currentLang === 'en' ? 'Project Rating' : 'Оценка на проекта'}</div>
                            <div style="color: #d4af37; margin-bottom: 5px; font-size: 0.9rem;">★★★★★ 0.0 (0)</div>
                            <div style="font-size: 0.8rem; color: #8c8275; margin-bottom: 10px;">${currentLang === 'en' ? 'Share your thoughts about this project' : 'Споделете мнението си за този проект'}</div>
                            <div style="font-size: 0.85rem; color: #8c8275;">${currentLang === 'en' ? 'No reviews yet.' : 'Все още няма ревюта.'}</div>
                        </div>
                    </div>
                </div>

                <!-- Описание -->
                ${project.desc ? `
                <div style="background: #f4eee5; padding: 25px; border: 1px solid #eadecc; margin-bottom: 40px;">
                    <h3 class="section-heading" style="margin-bottom: 10px;">${currentLang === 'en' ? 'Description' : 'Описание'}</h3>
                    <p style="line-height: 1.6; margin: 0; white-space: pre-line;">${project.desc}</p>
                </div>` : ''}

                ${videoHtml}
                ${floorPlansHtml}
                ${facadeHtml}
                ${galleryHtml}
            `;
        }

        function switchProject(id) {
            currentProjectId = id;
            window.history.pushState({}, '', `project-detail.html?id=${id}`);
            renderFullPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Интеграция със смяната на езика
        const originalSetLanguage = window.setLanguage;
        window.setLanguage = function(lang) {
            localStorage.setItem('siteLang', lang);
            if (typeof originalSetLanguage === 'function') {
                originalSetLanguage(lang);
            }
            if (allProjectsList.length > 0) {
                renderFullPage();
            }
        };

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('siteTheme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('siteTheme');
            if (savedTheme === 'dark') document.body.classList.add('dark-mode');

            const savedLang = localStorage.getItem('siteLang') || 'bg';
            if (typeof setLanguage === 'function') {
                setLanguage(savedLang);
            }

            initProjectPage();
        });
    </script>
</body>
</html>
