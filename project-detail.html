<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="page-title-catalog">Детайли за проект | Academy Architect Studio</title>
    
    <!-- Зареждане на файла с преводи (увери се, че името съвпада с твоя файл) -->
    <script src="translations_2.js"></script>

    <!-- Проверка за Тъмна тема преди зареждане -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('siteTheme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
            }
        })();
    </script>

    <style>
        body { background-color: #fbf9f4; color: #1a1a1a; font-family: sans-serif; margin: 0; transition: background-color 0.3s, color 0.3s; }
        .project-detail-container { padding: 40px 6%; min-height: 80vh; max-width: 1400px; margin: 0 auto; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #8c8275; text-decoration: none; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .back-link:hover { color: #1a1a1a; }
        
        .project-header { margin-bottom: 25px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 15px; }
        .project-title { font-size: 2.3rem; font-weight: 400; color: inherit; margin: 5px 0 0 0; }
        .project-style-tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #8c8275; font-weight: 700; }

        /* Навигация за езици и бутони */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 6%; background: inherit; border-bottom: 1px solid #eadecc; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { text-decoration: none; color: inherit; font-size: 0.9rem; font-weight: 500; }
        .header-actions { display: flex; align-items: center; gap: 15px; }
        .lang-switcher { display: flex; gap: 5px; }
        .lang-btn { background: none; border: 1px solid #eadecc; padding: 4px 8px; cursor: pointer; font-size: 0.75rem; font-weight: 600; color: inherit; border-radius: 4px; }
        .lang-btn:hover { background: #eadecc; }
        .btn-login { text-decoration: none; color: inherit; font-size: 0.85rem; font-weight: 600; padding: 6px 14px; border: 1px solid #1a1a1a; border-radius: 4px; }

        /* Падащо меню за бърз преглед */
        .quick-switch-box { display: flex; align-items: center; gap: 10px; }
        .quick-switch-box select { padding: 8px 12px; border: 1px solid #eadecc; background: #f4eee5; color: inherit; font-size: 0.85rem; border-radius: 4px; outline: none; cursor: pointer; }

        /* ТРИКОЛОНЕН ГРИД */
        .top-section-grid { 
            display: grid; 
            grid-template-columns: 1.2fr 1fr 340px; 
            gap: 25px; 
            align-items: start; 
            margin-bottom: 30px; 
        }

        .hero-image-box { width: 100%; height: 340px; border: 1px solid #eadecc; overflow: hidden; background: #fff; }
        .hero-image-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .project-sidebar { background: #f4eee5; padding: 25px; border: 1px solid #eadecc; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; height: 100%; }
        .community-opinion-card { background: #f4eee5; padding: 25px; border: 1px solid #eadecc; box-sizing: border-box; height: 100%; }

        .spec-row { display: flex; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid #eadecc; font-size: 0.9rem; }
        .spec-label { color: #8c8275; text-transform: uppercase; font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; }
        .spec-value { color: inherit; font-weight: 600; }

        .technical-drawings-section { margin-bottom: 30px; background: #f4eee5; padding: 30px; border: 1px solid #eadecc; }
        .tech-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 15px; }
        .tech-card img { width: 100%; height: 260px; object-fit: contain; background: #fff; border: 1px solid #eadecc; display: block; }
        
        .gallery-section { margin-bottom: 30px; background: #f4eee5; padding: 30px; border: 1px solid #eadecc; }
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 15px; }
        .gallery-grid img { width: 100%; height: 220px; object-fit: cover; border: 1px solid #eadecc; display: block; }

        /* Футър стилове */
        .main-footer { display: flex; justify-content: space-between; align-items: flex-start; padding: 40px 6%; border-top: 1px solid #eadecc; background: inherit; flex-wrap: wrap; gap: 20px; }

        /* Dark Mode Overrides */
        body.dark-mode { background-color: #121212 !important; color: #ffffff !important; }
        body.dark-mode .navbar, body.dark-mode .main-footer { border-color: #2c2c2c !important; }
        body.dark-mode .hero-image-box, body.dark-mode .tech-card img { background: #1e1e1e !important; border-color: #2c2c2c !important; }
        body.dark-mode .project-sidebar, 
        body.dark-mode .community-opinion-card,
        body.dark-mode .technical-drawings-section, 
        body.dark-mode .gallery-section,
        body.dark-mode .quick-switch-box select,
        body.dark-mode .lang-btn { background: #1a1a1a !important; border-color: #2c2c2c !important; color: #ffffff !important; }
        body.dark-mode .spec-row { border-bottom-color: #2c2c2c !important; }
        body.dark-mode .btn-login { border-color: #ffffff !important; color: #ffffff !important; }

        @media (max-width: 1100px) {
            .top-section-grid { grid-template-columns: 1fr; }
            .gallery-grid { grid-template-columns: 1fr; }
            .hero-image-box { height: 260px; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo-area" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
            <img src="assets/main-graphic.png" alt="Logo" class="logo-icon" style="height: 38px; width: auto; display: block;" onerror="this.style.display='none'">
            <span style="font-weight: 500; color: inherit; font-size: 1.1rem;" data-key="nav-studio">Academy Architect <span style="font-weight: 700; color: #8c8275;">Studio</span></span>
        </a>
        <nav class="nav-links" id="nav-links">
            <a href="index.html" data-key="nav-home">Начало</a>
            <a href="catalog.html" data-key="nav-catalog">Проекти</a>
            <a href="about.html" data-key="nav-about">За нас</a>
            <a href="planner.html" data-key="nav-planner">ИИ Планер</a>
            <a href="contact.html" data-key="nav-contact">Контакти</a>
        </nav>
        <div class="header-actions">
            <div class="lang-switcher">
                <button id="btn-bg" class="lang-btn" type="button">BG</button>
                <button id="btn-en" class="lang-btn" type="button">EN</button>
            </div>
            <a href="login.html" class="btn-login" data-key="nav-login">Вход</a>
        </div>
    </header>

    <main class="project-detail-container">
        <a href="catalog.html" class="back-link" data-key="project-back">← Обратно към проектите</a>
        <div id="projectDetailsArea">
            <p style="color: #8c8275;" data-key="loading-project">Зареждане на детайлите за проекта...</p>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-logo-area" style="display: flex; align-items: center; gap: 12px;">
            <img src="assets/main-graphic.png" alt="Logo" class="footer-logo" style="height: 32px; width: auto;" onerror="this.style.display='none'">
            <div>
                <span class="footer-brand" style="font-weight: 600; color: inherit; font-size: 1rem;" data-key="nav-studio">Academy Architect <span style="font-weight: 700; color: #8c8275;">Studio</span></span>
                <p class="footer-subtext" style="font-size: 0.65rem; letter-spacing: 1px; color: #8c8275; margin-top: 2px;" data-key="hero-eyebrow">АРХИТЕКТУРНО СТУДИО</p>
            </div>
        </div>
        <div class="footer-col">
            <h4 style="font-size: 0.85rem; letter-spacing: 1px; margin-bottom: 10px; color: inherit;" data-key="footer-contacts">Контакти</h4>
            <p style="font-size: 0.85rem; color: #555; margin: 4px 0;">Sofia · Plovdiv · Varna</p>
            <p style="font-size: 0.85rem; margin: 4px 0;"><a href="mailto:info@architectstudio.com" style="color: #555; text-decoration: none;">info@architectstudio.com</a></p>
        </div>
        <div class="footer-col footer-right" style="text-align: right; color: #8c8275; font-size: 0.85rem;">
            <p>© 2026</p>
            <p data-key="footer-rights">Academy Architect Studio — Всички права запазени.</p>
        </div>
    </footer>

    <!-- СВЪРЗВАНЕ С FIREBASE И ПРЕВОДИ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDeezhyddNjZyOeo9MyuwOuhXvFCCscUzg",
            authDomain: "architect-studio-1810c.firebaseapp.com",
            projectId: "architect-studio-1810c",
            storageBucket: "architect-studio-1810c.firebasestorage.app",
            messagingSenderId: "1053914253758",
            appId: "1:1053914253758:web:97d9bc28ac5465730311ef",
            measurementId: "G-NN7GYSF55G"
        };

        async function loadProjectDetails() {
            const container = document.getElementById('projectDetailsArea');
            const urlParams = new URLSearchParams(window.location.search);
            let projectId = urlParams.get('id') || urlParams.get('index'); 

            try {
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);

                const querySnapshot = await getDocs(collection(db, "projects"));
                if (querySnapshot.empty) {
                    container.innerHTML = `<h2>Няма намерени проекти в базата данни.</h2>`;
                    return;
                }

                let allProjects = [];
                querySnapshot.forEach((document) => {
                    allProjects.push({ id: document.id, ...document.data() });
                });

                if (!projectId) {
                    projectId = allProjects[0].id;
                }

                const docRef = doc(db, "projects", projectId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const p = docSnap.data();
                    const mainImgSrc = p.mainImage || (p.gallery && p.gallery[0]) || 'assets/main-graphic.png';

                    let floorPlansCards = [];
                    if (p.floorPlans && p.floorPlans.length > 0) {
                        p.floorPlans.forEach((plan, i) => {
                            floorPlansCards.push(`<div class="tech-card"><span style="font-size:0.8rem; font-weight:600; display:block; margin-bottom:5px; padding: 0 10px;">Разпределение / План ${p.floorPlans.length > 1 ? (i + 1) : ''}</span><img src="${plan}" alt="План"></div>`);
                        });
                    }

                    let facadeCards = [];
                    if (p.facadeImages && p.facadeImages.length > 0) {
                        p.facadeImages.forEach((facade, i) => {
                            facadeCards.push(`<div class="tech-card"><span style="font-size:0.8rem; font-weight:600; display:block; margin-bottom:5px; padding: 0 10px;">Фасада ${p.facadeImages.length > 1 ? (i + 1) : ''}</span><img src="${facade}" alt="Фасада"></div>`);
                        });
                    }
                    if (p.sectionImage) {
                        facadeCards.push(`<div class="tech-card"><span style="font-size:0.8rem; font-weight:600; display:block; margin-bottom:5px; padding: 0 10px;">Разрез</span><img src="${p.sectionImage}" alt="Разрез"></div>`);
                    }

                    let floorPlansSectionHTML = floorPlansCards.length > 0 ? `
                        <div class="technical-drawings-section">
                            <span class="spec-label" data-key="project-tech-docs">Техническа документация</span>
                            <h3 style="font-size: 1.2rem; font-weight: 400; margin: 5px 0 15px 0;" data-key="project-floor-plans">Разпределения по етажи</h3>
                            <div class="tech-grid">${floorPlansCards.join('')}</div>
                        </div>
                    ` : '';

                    let facadeSectionHTML = facadeCards.length > 0 ? `
                        <div class="technical-drawings-section">
                            <span class="spec-label" data-key="project-tech-docs">Техническа документация</span>
                            <h3 style="font-size: 1.2rem; font-weight: 400; margin: 5px 0 15px 0;" data-key="project-facades">Фасади и Разрези</h3>
                            <div class="tech-grid">${facadeCards.join('')}</div>
                        </div>
                    ` : '';

                    let galleryHTML = p.gallery && p.gallery.length > 0 ? `
                        <div class="gallery-section">
                            <span class="spec-label" data-key="project-gallery">Галерия</span>
                            <h3 style="font-size: 1.2rem; font-weight: 400; margin: 5px 0 15px 0;" data-key="project-visuals">Визуализации</h3>
                            <div class="gallery-grid">${p.gallery.map(img => `<img src="${img}" alt="Визуализация">`).join('')}</div>
                        </div>
                    ` : '';

                    let optionsHTML = allProjects.map(proj => `
                        <option value="${proj.id}" ${proj.id === projectId ? 'selected' : ''}>${proj.title || proj.id}</option>
                    `).join('');

                    container.innerHTML = `
                        <div class="project-header">
                            <div>
                                <span class="project-style-tag">${p.style || 'Архитектурен проект'}</span>
                                <h1 class="project-title">${p.title || 'Без заглавие'}</h1>
                            </div>
                            <div class="quick-switch-box">
                                <span class="spec-label" style="margin:0;" data-key="project-select-label">Избери проект:</span>
                                <select id="projectSelector" onchange="if(this.value) window.location.href='project-detail.html?id=' + encodeURIComponent(this.value);">
                                    ${optionsHTML}
                                </select>
                            </div>
                        </div>

                        <div class="top-section-grid">
                            <div class="hero-image-box">
                                <img src="${mainImgSrc}" alt="${p.title || ''}">
                            </div>

                            <div class="project-sidebar">
                                <div>
                                    <span class="spec-label" data-key="project-info-title">ИНФОРМАЦИЯ ЗА ПРОЕКТА</span>
                                    <div style="font-size: 1.2rem; font-weight: 600; margin: 5px 0 15px 0; color: inherit;">${p.title || ''}</div>
                                </div>

                                <div style="display: flex; flex-direction: column; gap: 10px;">
                                    <div class="spec-row"><span class="spec-label" data-key="spec-category">Категория</span><span class="spec-value">${p.mainCategory || p.category || '-'}</span></div>
                                    <div class="spec-row"><span class="spec-label" data-key="spec-style">Стил</span><span class="spec-value">${p.style || '-'}</span></div>
                                    <div class="spec-row"><span class="spec-label" data-key="spec-construction">Конструкция</span><span class="spec-value">${p.material || '-'}</span></div>
                                    <div class="spec-row"><span class="spec-label" data-key="spec-area">Площ</span><span class="spec-value">${p.area ? p.area + ' sq.m' : '-'}</span></div>
                                    <div class="spec-row"><span class="spec-label" data-key="spec-floors">Етажи</span><span class="spec-value">${p.floors || '-'}</span></div>
                                    <div class="spec-row"><span class="spec-label" data-key="spec-price">Цена на проекта</span><span class="spec-value">${p.price ? p.price + ' €' : '0 €'}</span></div>
                                </div>
                            </div>

                            <div class="community-opinion-card">
                                <span class="spec-label" data-key="project-community-title">МНЕНИЕ НА ОБЩНОСТТА</span>
                                <h3 style="font-size: 1.1rem; margin: 5px 0 5px 0; font-weight: 600;" data-key="project-rating-title">Оценка на проекта</h3>
                                <div style="font-size: 0.85rem; color: #b8860b; margin-bottom: 8px;">★★★★★ <span style="color: inherit; font-weight: bold;">0.0 (0)</span></div>
                                <p style="font-size: 0.80rem; color: #8c8275; margin: 0 0 15px 0;" data-key="project-share-opinion">Споделете вашето мнение за този проект</p>
                                <p style="font-size: 0.85rem; color: #666; margin: 0;" data-key="project-no-reviews">Все още няма отзиви.</p>
                            </div>
                        </div>

                        ${floorPlansSectionHTML}
                        ${facadeSectionHTML}
                        ${galleryHTML}
                    `;

                    // Прилагаме активния език веднага след като динамичният HTML се зареди
                    const currentLang = localStorage.getItem('siteLang') || 'bg';
                    if (typeof setLanguage === 'function') {
                        setLanguage(currentLang);
                    }

                } else {
                    container.innerHTML = `<h2>Проектът не е намерен в базата данни.</h2><p><a href="catalog.html" class="back-link">Обратно към каталога</a></p>`;
                }
            } catch (err) {
                console.error("Грешка при зареждане на проекта:", err);
                container.innerHTML = `<h2 style="color: red;">Грешка при връзка с Firebase:</h2><p>${err.message}</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadProjectDetails();

            // Връзка с бутоните за превод
            const btnBg = document.getElementById('btn-bg');
            const btnEn = document.getElementById('btn-en');

            if (btnBg) {
                btnBg.addEventListener('click', () => {
                    if (typeof setLanguage === 'function') setLanguage('bg');
                });
            }
            if (btnEn) {
                btnEn.addEventListener('click', () => {
                    if (typeof setLanguage === 'function') setLanguage('en');
                });
            }
        });
    </script>
</body>
</html>
