<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детайли за проект | Academy Architect Studio</title>
    <link rel="stylesheet" href="style.css">
    
    <script>
        (function() {
            const savedTheme = localStorage.getItem('siteTheme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
            }
        })();
    </script>

    <style>
        body { background-color: #fbf9f4; color: #1a1a1a; font-family: sans-serif; margin: 0; transition: background-color 0.3s, color 0.3s; }
        .project-detail-container { padding: 40px 6%; min-height: 80vh; max-width: 1400px; margin: 0 auto; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #8c8275; text-decoration: none; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .back-link:hover { color: #1a1a1a; }
        
        .project-header { margin-bottom: 25px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 15px; }
        .project-title { font-size: 2.3rem; font-weight: 400; color: inherit; margin: 5px 0 0 0; }
        .project-style-tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #8c8275; font-weight: 700; }

        /* Падащо меню за бърз преглед */
        .quick-switch-box { display: flex; align-items: center; gap: 10px; }
        .quick-switch-box select { padding: 8px 12px; border: 1px solid #eadecc; background: #f4eee5; color: inherit; font-size: 0.85rem; border-radius: 4px; outline: none; cursor: pointer; }

        /* ТРИКОЛОНЕН ГРИД: Снимка (ляво) | Информация (среда) | Ревюта (дясно) */
        .top-section-grid { 
            display: grid; 
            grid-template-columns: 1.2fr 1fr 340px; 
            gap: 25px; 
            align-items: start; 
            margin-bottom: 30px; 
        }

        .hero-image-box { width: 100%; height: 340px; border: 1px solid #eadecc; overflow: hidden; background: #fff; }
        .hero-image-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* Проектна информация (средната колона) */
        .project-sidebar { background: #f4eee5; padding: 25px; border: 1px solid #eadecc; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; height: 100%; }
        
        /* Community Opinion (най-дясната колона) */
        .community-opinion-card { background: #f4eee5; padding: 25px; border: 1px solid #eadecc; box-sizing: border-box; height: 100%; }

        .spec-row { display: flex; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid #eadecc; font-size: 0.9rem; }
        .spec-label { color: #8c8275; text-transform: uppercase; font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; }
        .spec-value { color: inherit; font-weight: 600; }
        .project-price-box { font-size: 1.5rem; font-weight: 600; color: inherit; margin-top: 5px; }

        /* Техническа документация */
        .technical-drawings-section { margin-bottom: 30px; background: #f4eee5; padding: 30px; border: 1px solid #eadecc; }
        .tech-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 15px; }
        .tech-card img { width: 100%; height: 260px; object-fit: contain; background: #fff; border: 1px solid #eadecc; display: block; }
        
        /* Галерия */
        .gallery-section { margin-bottom: 30px; background: #f4eee5; padding: 30px; border: 1px solid #eadecc; }
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 15px; }
        .gallery-grid img { width: 100%; height: 220px; object-fit: cover; border: 1px solid #eadecc; display: block; }

        /* Dark Mode Overrides */
        body.dark-mode { background-color: #121212 !important; color: #ffffff !important; }
        body.dark-mode .hero-image-box, 
        body.dark-mode .tech-card img { background: #1e1e1e !important; border-color: #2c2c2c !important; }
        body.dark-mode .project-sidebar, 
        body.dark-mode .community-opinion-card,
        body.dark-mode .technical-drawings-section, 
        body.dark-mode .gallery-section,
        body.dark-mode .quick-switch-box select { background: #1a1a1a !important; border-color: #2c2c2c !important; color: #ffffff !important; }
        body.dark-mode .spec-row { border-bottom-color: #2c2c2c !important; }

        @media (max-width: 1100px) {
            .top-section-grid { grid-template-columns: 1fr; }
            .gallery-grid { grid-template-columns: 1fr; }
            .hero-image-box { height: 260px; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo-area" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
            <img src="assets/main-graphic.png" alt="Logo" class="logo-icon" style="height: 38px; width: auto; display: block;" onerror="this.style.display='none'">
            <span style="font-weight: 500; color: inherit; font-size: 1.1rem;">Academy Architect <span style="font-weight: 700; color: #8c8275;">Studio</span></span>
        </a>
        <nav id="nav-links">
            <a href="index.html" data-lang="nav_home">Начало</a>
            <a href="catalog.html" data-lang="nav_projects">Проекти</a>
            <a href="about.html" data-lang="nav_about">За нас</a>
            <a href="planner.html" data-lang="nav_planner">ИИ Планер</a>
            <a href="contact.html" data-lang="nav_contact">Контакти</a>
        </nav>
        <div class="header-actions">
            <!-- Двуезичен бутон или селектор ако има такъв -->
            <a href="login.html" class="btn-login" data-lang="btn_login">Вход</a>
        </div>
    </header>

    <main class="project-detail-container">
        <a href="catalog.html" class="back-link" data-lang="back_to_projects">← Обратно към проектите</a>
        <div id="projectDetailsArea">
            <p style="color: #8c8275;" data-lang="loading_project">Зареждане на детайлите за проекта...</p>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-logo-area" style="display: flex; align-items: center; gap: 12px;">
            <img src="assets/main-graphic.png" alt="Logo" class="footer-logo" style="height: 32px; width: auto;" onerror="this.style.display='none'">
            <div>
                <span class="footer-brand" style="font-weight: 600; color: inherit; font-size: 1rem;">Academy Architect <span style="font-weight: 700; color: #8c8275;">Studio</span></span>
                <p class="footer-subtext" style="font-size: 0.65rem; letter-spacing: 1px; color: #8c8275; margin-top: 2px;" data-lang="footer_subtitle">АРХИТЕКТУРНО СТУДИО</p>
            </div>
        </div>
        <div class="footer-col">
            <h4 style="font-size: 0.85rem; letter-spacing: 1px; margin-bottom: 10px; color: inherit;">STUDIO</h4>
            <p style="font-size: 0.85rem; color: #555; margin: 4px 0;">Sofia · Plovdiv · Varna</p>
            <p style="font-size: 0.85rem; margin: 4px 0;"><a href="mailto:info@architectstudio.com" style="color: #555; text-decoration: none;">info@architectstudio.com</a></p>
        </div>
        <div class="footer-col footer-right" style="text-align: right; color: #8c8275; font-size: 0.85rem;">
            <p>© 2026</p>
            <p data-lang="footer_rights">Academy Architect Studio — Всички права запазени.</p>
        </div>
    </footer>

    <!-- СВЪРЗВАНЕ С FIREBASE И ПОДДРЪЖКА НА ЕЗИЦИ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDeezhyddNjZyOeo9MyuwOuhXvFCCscUzg",
            authDomain: "architect-studio-1810c.firebaseapp.com",
            projectId: "architect-studio-1810c",
            storageBucket: "architect-studio-1810c.firebasestorage.app",
            messagingSenderId: "1053914253758",
            appId: "1:1053914253758:web:97d9bc28ac5465730311ef",
            measurementId: "G-NN7GYSF55G"
        };

        // Речник за езиците (ако използвате локален превод подобно на другите страници)
        const translations = {
            bg: {
                nav_home: "Начало",
                nav_projects: "Проекти",
                nav_about: "За нас",
                nav_planner: "ИИ Планер",
                nav_contact: "Контакти",
                btn_login: "Вход",
                back_to_projects: "← Обратно към проектите",
                loading_project: "Зареждане на детайлите за проекта...",
                select_project: "Избери проект:",
                project_info: "ИНФОРМАЦИЯ ЗА ПРОЕКТА",
                category: "Категория",
                style: "Стил",
                construction: "Конструкция",
                area: "Площ",
                floors: "Етажи",
                price: "Цена на проекта",
                community_opinion: "МНЕНИЕ НА ОБЩНОСТТА",
                project_rating: "Оценка на проекта",
                share_opinion: "Споделете мнението си за този проект",
                no_reviews: "Все още няма ревюта.",
                floor_plans: "Разпределения по етажи",
                facades: "Фасади и Разрези",
                gallery: "Визуализации",
                tech_docs: "Техническа документация",
                gallery_label: "Галерия",
                not_found: "Проектът не е намерен в базата данни."
            },
            en: {
                nav_home: "Home",
                nav_projects: "Projects",
                nav_about: "About Us",
                nav_planner: "AI Planner",
                nav_contact: "Contact",
                btn_login: "Login",
                back_to_projects: "← Back to Projects",
                loading_project: "Loading project details...",
                select_project: "Select project:",
                project_info: "PROJECT INFORMATION",
                category: "Category",
                style: "Style",
                construction: "Construction",
                area: "Area",
                floors: "Floors",
                price: "Project price",
                community_opinion: "COMMUNITY OPINION",
                project_rating: "Project rating",
                share_opinion: "Share your opinion about this project",
                no_reviews: "No reviews yet.",
                floor_plans: "Floor Plans",
                facades: "Facades & Sections",
                gallery: "Visualizations",
                tech_docs: "Technical Documentation",
                gallery_label: "Gallery",
                not_found: "Project not found in the database."
            }
        };

        function getCurrentLang() {
            return localStorage.getItem('siteLang') || 'bg';
        }

        async function loadProjectDetails() {
            const container = document.getElementById('projectDetailsArea');
            const urlParams = new URLSearchParams(window.location.search);
            let projectId = urlParams.get('id') || urlParams.get('index'); 
            const lang = getCurrentLang();
            const t = translations[lang] || translations.bg;

            try {
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);

                const querySnapshot = await getDocs(collection(db, "projects"));
                if (querySnapshot.empty) {
                    container.innerHTML = `<h2>${t.not_found}</h2>`;
                    return;
                }

                let allProjects = [];
                querySnapshot.forEach((document) => {
                    allProjects.push({ id: document.id, ...document.data() });
                });

                // Ако няма подадено ID или индекс, взимаме първия проект
                if (!projectId) {
                    projectId = allProjects[0].id;
                }

                // Опитваме се да намерим проекта по ID или по индекс в масива (ако е подаден цифров индекс)
                let p = allProjects.find(item => item.id === projectId);
                if (!p && !isNaN(projectId) && allProjects[projectId]) {
                    p = allProjects[projectId];
                    projectId = p.id;
                }
                
                // Ако все пак не е намерен в масива по локално ID, правим директна заявка към Firestore
                if (!p) {
                    const docRef = doc(db, "projects", projectId);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        p = { id: docSnap.id, ...docSnap.data() };
                    }
                }

                if (p) {
                    const mainImgSrc = p.mainImage || (p.gallery && p.gallery[0]) || 'assets/main-graphic.png';

                    // Заглавие и полета спрямо езика (ако имате полета като title_en / title_bg)
                    const projectTitle = (lang === 'en' && p.titleEn) ? p.titleEn : (p.title || p.name || 'Без заглавие');
                    const projectStyle = (lang === 'en' && p.styleEn) ? p.styleEn : (p.style || 'Архитектурен проект');
                    const projectCategory = (lang === 'en' && p.mainCategoryEn) ? p.mainCategoryEn : (p.mainCategory || p.category || '-');
                    const projectMaterial = (lang === 'en' && p.materialEn) ? p.materialEn : (p.material || '-');

                    // 1. Разпределения по етажи
                    let floorPlansCards = [];
                    if (p.floorPlans && p.floorPlans.length > 0) {
                        p.floorPlans.forEach((plan, i) => {
                            floorPlansCards.push(`<div class="tech-card"><span style="font-size:0.8rem; font-weight:600; display:block; margin-bottom:5px; padding: 0 10px;">${lang === 'en' ? 'Floor Plan' : 'Разпределение / План'} ${p.floorPlans.length > 1 ? (i + 1) : ''}</span><img src="${plan}" alt="Plan"></div>`);
                        });
                    }

                    // 2. Фасади и разрез
                    let facadeCards = [];
                    if (p.facadeImages && p.facadeImages.length > 0) {
                        p.facadeImages.forEach((facade, i) => {
                            facadeCards.push(`<div class="tech-card"><span style="font-size:0.8rem; font-weight:600; display:block; margin-bottom:5px; padding: 0 10px;">${lang === 'en' ? 'Facade' : 'Фасада'} ${p.facadeImages.length > 1 ? (i + 1) : ''}</span><img src="${facade}" alt="Facade"></div>`);
                        });
                    }
                    if (p.sectionImage) {
                        facadeCards.push(`<div class="tech-card"><span style="font-size:0.8rem; font-weight:600; display:block; margin-bottom:5px; padding: 0 10px;">${lang === 'en' ? 'Section' : 'Разрез'}</span><img src="${p.sectionImage}" alt="Section"></div>`);
                    }

                    let floorPlansSectionHTML = floorPlansCards.length > 0 ? `
                        <div class="technical-drawings-section">
                            <span class="spec-label">${t.tech_docs}</span>
                            <h3 style="font-size: 1.2rem; font-weight: 400; margin: 5px 0 15px 0;">${t.floor_plans}</h3>
                            <div class="tech-grid">${floorPlansCards.join('')}</div>
                        </div>
                    ` : '';

                    let facadeSectionHTML = facadeCards.length > 0 ? `
                        <div class="technical-drawings-section">
                            <span class="spec-label">${t.tech_docs}</span>
                            <h3 style="font-size: 1.2rem; font-weight: 400; margin: 5px 0 15px 0;">${t.facades}</h3>
                            <div class="tech-grid">${facadeCards.join('')}</div>
                        </div>
                    ` : '';

                    let galleryHTML = p.gallery && p.gallery.length > 0 ? `
                        <div class="gallery-section">
                            <span class="spec-label">${t.gallery_label}</span>
                            <h3 style="font-size: 1.2rem; font-weight: 400; margin: 5px 0 15px 0;">${t.gallery}</h3>
                            <div class="gallery-grid">${p.gallery.map(img => `<img src="${img}" alt="Visualization">`).join('')}</div>
                        </div>
                    ` : '';

                    let optionsHTML = allProjects.map(proj => {
                        const optTitle = (lang === 'en' && proj.titleEn) ? proj.titleEn : (proj.title || proj.id);
                        return `<option value="${proj.id}" ${proj.id === projectId ? 'selected' : ''}>${optTitle}</option>`;
                    }).join('');

                    container.innerHTML = `
                        <div class="project-header">
                            <div>
                                <span class="project-style-tag">${projectStyle}</span>
                                <h1 class="project-title">${projectTitle}</h1>
                            </div>
                            <div class="quick-switch-box">
                                <span class="spec-label" style="margin:0;">${t.select_project}</span>
                                <select id="projectSelector" onchange="if(this.value) window.location.href='project-detail.html?id=' + encodeURIComponent(this.value);">
                                    ${optionsHTML}
                                </select>
                            </div>
                        </div>

                        <div class="top-section-grid">
                            <div class="hero-image-box">
                                <img src="${mainImgSrc}" alt="${projectTitle}">
                            </div>

                            <div class="project-sidebar">
                                <div>
                                    <span class="spec-label">${t.project_info}</span>
                                    <div class="project-price-box" style="font-size: 1.3rem; margin: 5px 0 15px 0;">${projectTitle}</div>
                                </div>

                                <div style="display: flex; flex-direction: column; gap: 10px;">
                                    <div class="spec-row"><span class="spec-label">${t.category}</span><span class="spec-value">${projectCategory}</span></div>
                                    <div class="spec-row"><span class="spec-label">${t.style}</span><span class="spec-value">${projectStyle}</span></div>
                                    <div class="spec-row"><span class="spec-label">${t.construction}</span><span class="spec-value">${projectMaterial}</span></div>
                                    <div class="spec-row"><span class="spec-label">${t.area}</span><span class="spec-value">${p.area ? p.area + ' sq.m' : '-'}</span></div>
                                    <div class="spec-row"><span class="spec-label">${t.floors}</span><span class="spec-value">${p.floors || '-'}</span></div>
                                    <div class="spec-row"><span class="spec-label">${t.price}</span><span class="spec-value">${p.price ? p.price + ' €' : '0 €'}</span></div>
                                </div>
                            </div>

                            <div class="community-opinion-card">
                                <span class="spec-label">${t.community_opinion}</span>
                                <h3 style="font-size: 1.1rem; margin: 5px 0 5px 0; font-weight: 600;">${t.project_rating}</h3>
                                <div style="font-size: 0.85rem; color: #b8860b; margin-bottom: 8px;">★★★★★ <span style="color: inherit; font-weight: bold;">0.0 (0)</span></div>
                                <p style="font-size: 0.8rem; color: #8c8275; margin: 0 0 15px 0;">${t.share_opinion}</p>
                                <p style="font-size: 0.85rem; color: #666; margin: 0;">${t.no_reviews}</p>
                            </div>
                        </div>

                        ${floorPlansSectionHTML}
                        ${facadeSectionHTML}
                        ${galleryHTML}
                    `;
                } else {
                    container.innerHTML = `<h2>${t.not_found}</h2><p><a href="catalog.html" class="back-link">${t.back_to_projects}</a></p>`;
                }
            } catch (err) {
                console.error("Грешка при зареждане на проекта:", err);
                container.innerHTML = `<h2 style="color: red;">Грешка при връзка с Firebase:</h2><p>${err.message}</p>`;
            }
        }

        window.addEventListener('DOMContentLoaded', loadProjectDetails);
    </script>
</body>
</html>
